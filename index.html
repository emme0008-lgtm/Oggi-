'use strict';const KEY='oggi-prototype-v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=localDate(new Date());const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)};const dateFmt=(s,opts={weekday:'short',day:'numeric',month:'short'})=>new Date(s+'T12:00:00').toLocaleDateString('it-IT',opts);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state&&typeof state==='object'?state:{events:[],tasks:[],contacts:[],lists:['Casa','Lavoro','Spesa','Famiglia'],defaultReminder:'30'};for(const k of ['events','tasks','contacts','lists'])if(!Array.isArray(state[k]))state[k]=[];if(!state.lists.length)state.lists=['Casa','Lavoro','Spesa','Famiglia'];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('Salvataggio non riuscito. Verifica lo spazio disponibile.');return false}};const sortedEvents=()=>[...state.events].sort((a,b)=>(a.date+'T'+(a.allDay?'00:00':a.start)).localeCompare(b.date+'T'+(b.allDay?'00:00':b.start)));const sortedTasks=()=>[...state.tasks].sort((a,b)=>(a.done-b.done)||((a.due||'9999').localeCompare(b.due||'9999'))||((a.priority==='high'?-1:0)-(b.priority==='high'?-1:0)));const avatar=c=>c.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(c.photo)?`<img class="avatar-photo" src="${c.photo}" alt="">`:`<span class="avatar">${esc((c.name||"?").charAt(0).toUpperCase())}</span>`;const eventOccurrences=(e,from,to)=>{const result=[];let d=e.date;let n=0;while(d<=to&&n<400){if(d>=from)result.push({...e,occurrence:d});if(e.repeat==='none'||!e.repeat)break;let next;if(e.repeat==='daily')next=addDays(d,1);else if(e.repeat==='weekly')next=addDays(d,7);else{const base=new Date(e.date+'T12:00:00');const monthShift=e.repeat==='monthly'?++n:12*(++n);const target=new Date(base.getFullYear(),base.getMonth()+monthShift,1,12);target.setDate(Math.min(base.getDate(),new Date(target.getFullYear(),target.getMonth()+1,0).getDate()));next=localDate(target)}if(next<=d)break;d=next;if(['daily','weekly'].includes(e.repeat))n++}return result};const occurrences=(from,to)=>state.events.flatMap(e=>eventOccurrences(e,from,to)).sort((a,b)=>(a.occurrence+'T'+(a.allDay?'00:00':a.start)).localeCompare(b.occurrence+'T'+(b.allDay?'00:00':b.start)));
function render(){const d=new Date();$('#today').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());const ev=occurrences(today,addDays(today,7));$('#events').innerHTML=ev.length?ev.slice(0,5).map(e=>`<button class="entry entrybutton ${e.occurrence===today?'event-today':''}" data-action="editEvent" data-id="${esc(e.id)}" data-kind="${e.calendar==='family'?'family':'personal'}"><span class="when">${e.occurrence===today?'Oggi':esc(dateFmt(e.occurrence))}<br>${e.allDay?'Tutto il giorno':esc(e.start)}</span><span class="detail"><strong>${esc(e.title)}</strong><small>${esc(e.place|| (e.calendar==='family'?'Famiglia':'Personale'))}</small></span><span class="arrow">›</span></button>`).join('')+(ev.length>5?`<button class="sectionfoot" data-action="openEvents">Altri ${ev.length-5} appuntamenti ›</button>`:''):'<div class="empty">Nessun appuntamento nei prossimi 7 giorni</div>';const ts=sortedTasks().filter(t=>!t.done&&(!t.due||t.due<=addDays(today,7)));$('#tasks').innerHTML=ts.length?ts.slice(0,4).map(t=>`<div class="entry ${t.priority==='high'?'task-high':t.due===today?'task-today':''}"><span class="task-indicator" aria-hidden="true">□</span><button class="entrybutton detail" data-action="editTask" data-id="${esc(t.id)}"><strong>${esc(t.title)}</strong><small>${esc(t.list)}${t.due?' · '+(t.due===today?'Oggi':dateFmt(t.due)):''}</small></button><span class="arrow">›</span></div>`).join('')+(ts.length>4?`<button class="sectionfoot" data-action="openTasks">Altre ${ts.length-4} attività ›</button>`:''):'<div class="empty">Nessuna attività in sospeso</div>';const contacts=state.contacts.filter(c=>c.favorite).sort((a,b)=>(a.order??999)-(b.order??999)).slice(0,8);$('#favorites').innerHTML=contacts.length?contacts.map(c=>`<div class="person"><button data-action="editContact" data-id="${esc(c.id)}" style="border:0;background:none;width:100%;color:inherit">${avatar(c)}<b>${esc(c.name)}</b></button><div class="quick">${c.phone?`<a aria-label="Chiama ${esc(c.name)}" href="tel:${encodeURIComponent(c.phone.replace(/[^+\d]/g,''))}">☎</a><a aria-label="WhatsApp ${esc(c.name)}" href="https://wa.me/${encodeURIComponent(c.phone.replace(/\D/g,''))}" target="_blank" rel="noopener">WA</a>`:''}${c.email?`<a aria-label="Email ${esc(c.name)}" href="mailto:${encodeURIComponent(c.email)}">✉</a>`:''}</div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Aggiungi i tuoi contatti preferiti</div>'};const show=(title,html)=>{$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#overlay').classList.remove('hide');$('#closeModal').focus()};const hide=()=>$('#overlay').classList.add('hide');$('#closeModal').onclick=hide;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('#dayPopupBackdrop'))closeDayPopup();else hide()}});const field=(label,name,value='',type='text',required=false)=>`<label class="field" for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`;const select=(label,name,options,value)=>`<label class="field" for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select>`;const textArea=(label,name,value='')=>`<label class="field" for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}">${esc(value)}</textarea>`;const actionButtons=(type,id)=>`<div class="actions">${id?`<button type="button" class="danger" data-action="delete${type}" data-id="${esc(id)}">Elimina</button>`:''}<button class="primary" type="submit">Salva</button></div>`;
function eventForm(id){const e=state.events.find(x=>x.id===id)||{title:'',date:today,start:'09:00',end:'10:00',endDate:today,allDay:false,calendar:'personal',repeat:'none',reminder:state.defaultReminder||'30',place:'',notes:'',contact:''};show(id?'Modifica appuntamento':'Nuovo appuntamento',`<form id="eventForm">${field('Titolo','title',e.title,'text',true)}${field('Data inizio','date',e.date,'date',true)}<label class="checkline"><input type="checkbox" name="allDay" ${e.allDay?'checked':''}> Tutto il giorno</label><div class="pair">${field('Ora inizio','start',e.start,'time')}${field('Ora fine','end',e.end,'time')}</div>${field('Data fine','endDate',e.endDate||e.date,'date',true)}${select('Calendario','calendar',[['personal','Personale'],['family','Famiglia']],e.calendar)}${select('Ripeti','repeat',[['none','Non ripetere'],['daily','Ogni giorno'],['weekly','Ogni settimana'],['monthly','Ogni mese'],['yearly','Ogni anno']],e.repeat)}${select('Promemoria','reminder',[['none','Nessuno'],['0',"All'ora dell'appuntamento"],['10','10 minuti prima'],['30','30 minuti prima'],['60','1 ora prima'],['1440','1 giorno prima']],e.reminder)}${field('Luogo','place',e.place)}${select('Contatto associato','contact',[['','Nessuno'],...state.contacts.map(c=>[c.id,c.name])],e.contact)}${textArea('Note','notes',e.notes)}${actionButtons('Event',id)}</form><p class="muted">I promemoria sono registrati, ma le notifiche push non sono ancora attive in questo prototipo.</p>`);const startInput=$('#f_start'),endInput=$('#f_end'),endDateInput=$('#f_endDate'),dateInput=$('#f_date');startInput.addEventListener('change',()=>{if(!startInput.value)return;const [h,m]=startInput.value.split(':').map(Number);const total=h*60+m+60;endInput.value=`${pad(Math.floor(total/60)%24)}:${pad(total%60)}`;endDateInput.value=total>=1440?addDays(dateInput.value||today,1):(dateInput.value||today)});dateInput.addEventListener('change',()=>{if(endDateInput.value<dateInput.value)endDateInput.value=dateInput.value});$('#eventForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),v=Object.fromEntries(f.entries());v.allDay=f.has('allDay');v.endDate=v.endDate||v.date;if(v.endDate<v.date||(!v.allDay&&v.endDate===v.date&&v.end<=v.start)){alert('La fine deve essere successiva all’inizio.');return}const next={...e,...v,id:id||uid()};if(id)state.events=state.events.map(x=>x.id===id?next:x);else state.events.push(next);if(save()){hide();render()}}}
function taskForm(id){const t=state.tasks.find(x=>x.id===id)||{title:'',list:state.lists[0],due:'',priority:'normal',repeat:'none',notes:'',done:false};show(id?'Modifica attività':'Nuova attività',`<form id="taskForm">${field('Attività','title',t.title,'text',true)}${select('Lista','list',state.lists.map(l=>[l,l]),t.list)}${field('Scadenza facoltativa','due',t.due,'date')}${select('Priorità','priority',[['low','Bassa'],['normal','Normale'],['high','Alta']],t.priority)}${select('Ripetizione','repeat',[['none','Nessuna'],['daily','Giornaliera'],['weekly','Settimanale'],['monthly','Mensile'],['yearly','Annuale']],t.repeat)}${textArea('Note','notes',t.notes)}${actionButtons('Task',id)}</form>`);$('#taskForm').onsubmit=ev=>{ev.preventDefault();const v=Object.fromEntries(new FormData(ev.target).entries());if(v.repeat!=='none'&&!v.due){alert('Per le attività ricorrenti inserisci una scadenza.');return}const next={...t,...v,id:id||uid()};if(id)state.tasks=state.tasks.map(x=>x.id===id?next:x);else state.tasks.push(next);if(save()){hide();render()}}}
function contactForm(id){const c=state.contacts.find(x=>x.id===id)||{name:'',phone:'',email:'',notes:'',photo:'',favorite:true,order:state.contacts.length};show(id?'Modifica contatto':'Nuovo contatto',`<form id="contactForm">${field('Nome','name',c.name,'text',true)}${field('Telefono','phone',c.phone,'tel')}${field('Email','email',c.email,'email')}${textArea('Note','notes',c.notes)}<label class="field" for="contactPhoto">Foto del contatto (galleria)</label><input id="contactPhoto" type="file" accept="image/*"><div id="photoPreview" class="photo-preview">${avatar(c)}</div><button type="button" class="tab" id="removePhoto">Rimuovi foto</button><label class="checkline"><input type="checkbox" name="favorite" ${c.favorite?'checked':''}> Mostra tra i preferiti</label>${actionButtons('Contact',id)}</form>`);let photoData=c.photo||'';$('#contactPhoto').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Seleziona un’immagine.');return}try{const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');const size=220;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const side=Math.min(bitmap.width,bitmap.height);ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,size,size);photoData=canvas.toDataURL('image/jpeg',.72);bitmap.close();$('#photoPreview').innerHTML=`<img class="avatar-photo" src="${photoData}" alt="Anteprima foto">`}catch{alert('Impossibile leggere la foto.')}});$('#removePhoto').onclick=()=>{photoData='';$('#contactPhoto').value='';$('#photoPreview').innerHTML=`<span class="avatar">${esc($('#f_name').value.trim().charAt(0).toUpperCase()||'?')}</span>`};$('#contactForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),v=Object.fromEntries(f.entries());if(!v.phone&&!v.email){alert('Inserisci almeno un numero di telefono o un indirizzo email.');return}v.favorite=f.has('favorite');v.photo=photoData;const next={...c,...v,id:id||uid()};if(id)state.contacts=state.contacts.map(x=>x.id===id?next:x);else state.contacts.push(next);if(save()){hide();render()}}}
function completeTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(t.repeat!=='none'&&t.due){let d=t.due;if(t.repeat==='daily')d=addDays(d,1);else if(t.repeat==='weekly')d=addDays(d,7);else{const base=new Date(d+'T12:00:00');const target=new Date(base.getFullYear(),base.getMonth()+(t.repeat==='monthly'?1:12),1,12);target.setDate(Math.min(base.getDate(),new Date(target.getFullYear(),target.getMonth()+1,0).getDate()));d=localDate(target)}state.tasks.push({...t,id:uid(),due:d,done:false})}t.done=true;t.completedAt=new Date().toISOString();save();render()}
function listView(kind){if(kind==='Events'){let filter='all',mode='today',selected=today,anchor=today;const draw=()=>{const base=new Date(anchor+'T12:00:00');const first=mode==='month'?localDate(new Date(base.getFullYear(),base.getMonth(),1,12)):mode==='week'?addDays(anchor,-((base.getDay()+6)%7)):today;const last=mode==='month'?localDate(new Date(base.getFullYear(),base.getMonth()+1,0,12)):mode==='week'?addDays(first,6):today;const rows=occurrences(first,last).filter(e=>filter==='all'||e.calendar===filter);let grid='';if(mode!=='today'){const days=mode==='month'?42:7;const start=mode==='month'?addDays(first,-((new Date(first+'T12:00:00').getDay()+6)%7)):first;grid=`<div class="calendar-controls"><button data-action="prevPeriod">‹</button><b>${esc(dateFmt(anchor,{month:'long',year:'numeric'}))}</b><button data-action="nextPeriod">›</button></div><div class="calendar-grid">${['L','M','M','G','V','S','D'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${Array.from({length:days},(_,i)=>{const d=addDays(start,i);return `<button class="calendar-day ${d===selected?'active':''} ${d<first||d>last?'outside':''} ${rows.some(e=>e.occurrence===d)?'has-event':''}" data-action="selectDay" data-date="${d}">${Number(d.slice(-2))}</button>`}).join('')}</div>`}const shown=mode==='today'?rows:[];show('Calendario',`<div class="tabs">${[['all','Tutti'],['personal','Personale'],['family','Famiglia']].map(([v,n])=>`<button class="tab ${filter===v?'active':''}" data-action="filterEvents" data-filter="${v}">${n}</button>`).join('')}</div><div class="tabs">${[['today','Oggi'],['week','Settimana'],['month','Mese']].map(([v,n])=>`<button class="tab ${mode===v?'active':''}" data-action="modeEvents" data-mode="${v}">${n}</button>`).join('')}</div>${grid}${mode==='today'?`<p class="muted">${esc(dateFmt(today,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</p><button class="primary" data-action="addEvent">+ Appuntamento</button><div style="margin-top:15px">${shown.map(e=>`<div class="listrow"><button class="row-title" data-action="editEvent" data-id="${esc(e.id)}"><b>${e.allDay?'Tutto il giorno':esc(e.start+'–'+e.end)}</b><br>${esc(e.title)} <small>· ${e.calendar==='family'?'Famiglia':'Personale'}</small></button><button data-action="editEvent" data-id="${esc(e.id)}">Apri ›</button></div>`).join('')||'<p class="muted">Nessun appuntamento oggi</p>'}</div>`:`<p class="muted">Tocca una data per vedere gli appuntamenti in una finestra.</p>`}`)};window._eventFilter=f=>{filter=f;draw()};window._eventMode=m=>{mode=m;anchor=today;selected=today;draw()};window._eventPeriod=step=>{const d=new Date(anchor+'T12:00:00');if(mode==='month')d.setMonth(d.getMonth()+step);else d.setDate(d.getDate()+7*step);anchor=localDate(d);selected=mode==='month'?localDate(new Date(d.getFullYear(),d.getMonth(),1,12)):addDays(anchor,-((d.getDay()+6)%7));draw()};window._eventSelect=d=>{selected=d;draw();openDayPopup(d,filter)};draw();return}if(kind==='Tasks'){let list='all';const draw=()=>{const rows=sortedTasks().filter(t=>list==='all'||t.list===list);show('Cose da fare',`<div class="tabs">${[['all','Tutte'],...state.lists.map(l=>[l,l])].map(([v,n])=>`<button class="tab ${v===list?'active':''}" data-action="filterTasks" data-filter="${esc(v)}">${esc(n)}</button>`).join('')}</div><button class="primary" data-action="addTask">+ Attività</button> <button class="tab" data-action="addList">+ Lista</button><div style="margin-top:14px">${rows.map(t=>`<div class="listrow ${t.done?'done':''}"><input class="taskcheck" type="checkbox" ${t.done?'checked':''} data-action="toggleTask" data-id="${esc(t.id)}"><button class="row-title" data-action="editTask" data-id="${esc(t.id)}"><strong>${esc(t.title)}</strong><small>${esc(t.list)}${t.due?' · '+esc(dateFmt(t.due)):''}</small></button><button data-action="editTask" data-id="${esc(t.id)}">Modifica</button></div>`).join('')||'<p class="muted">Nessuna attività</p>'}</div>`)};window._taskFilter=f=>{list=f;draw()};draw();return}show('Rubrica',`<button class="primary" data-action="addContact">+ Contatto</button><p class="muted">Usa ↑ e ↓ per ordinare manualmente i preferiti.</p>${[...state.contacts].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(c=>`<div class="listrow"><span>${avatar(c)}<strong>${esc(c.name)} ${c.favorite?'★':''}</strong><small>${esc(c.phone||c.email)}</small></span>${c.favorite?`<button data-action="moveContact" data-id="${esc(c.id)}" data-dir="-1">↑</button><button data-action="moveContact" data-id="${esc(c.id)}" data-dir="1">↓</button>`:''}<button data-action="editContact" data-id="${esc(c.id)}">Modifica</button></div>`).join('')||'<p class="muted">Nessun contatto</p>'}`)}
function closeDayPopup(){document.querySelector('#dayPopupBackdrop')?.remove()}function openDayPopup(date,filter='all'){closeDayPopup();const rows=occurrences(date,date).filter(e=>filter==='all'||e.calendar===filter);const backdrop=document.createElement('div');backdrop.className='day-popup-backdrop';backdrop.id='dayPopupBackdrop';backdrop.innerHTML=`<div class="day-popup" role="dialog" aria-modal="true" aria-label="Appuntamenti del giorno"><div class="day-popup-head"><h3>${esc(dateFmt(date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</h3><button class="day-popup-close" data-action="closeDayPopup" aria-label="Chiudi appuntamenti">✕</button></div>${rows.map(e=>`<div class="listrow"><button class="row-title" data-action="editEvent" data-id="${esc(e.id)}"><b>${e.allDay?'Tutto il giorno':esc(e.start+'–'+e.end)}</b><br>${esc(e.title)} <small>· ${e.calendar==='family'?'Famiglia':'Personale'}</small></button><button data-action="editEvent" data-id="${esc(e.id)}">Apri ›</button></div>`).join('')||'<p class="muted">Nessun appuntamento per questa data.</p>'}<button class="primary" data-action="addEventOnDay" data-date="${esc(date)}">+ Nuovo appuntamento</button></div>`;backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeDayPopup()});document.body.appendChild(backdrop);backdrop.querySelector('.day-popup-close').focus()}
function deleteItem(type,id){const plural={Event:'events',Task:'tasks',Contact:'contacts'}[type];const obj=state[plural].find(x=>x.id===id);if(!obj)return;const label=obj.title||obj.name;if(!confirm(`Eliminare definitivamente “${label}”? Questa operazione non può essere annullata.`))return;state[plural]=state[plural].filter(x=>x.id!==id);if(save()){hide();render()}}document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const {action,id,filter,mode,dir}=el.dataset;if(action==='closeDayPopup'){closeDayPopup();return}if(action==='addEventOnDay'){const day=el.dataset.date;closeDayPopup();eventForm();$('#f_date').value=day;$('#f_endDate').value=day;return}if(action==='editEvent'&&document.querySelector('#dayPopupBackdrop'))closeDayPopup();if(action==='checkTask'){completeTask(id);return}if(action==='toggleTask'){const t=state.tasks.find(x=>x.id===id);if(t){if(t.done){t.done=false;delete t.completedAt;save();listView('Tasks');render()}else{completeTask(id);listView('Tasks')}}return}if(action.startsWith('add')&&['addEvent','addTask','addContact'].includes(action)){({addEvent:eventForm,addTask:taskForm,addContact:contactForm})[action]();return}if(action.startsWith('edit')){({editEvent:eventForm,editTask:taskForm,editContact:contactForm})[action](id);return}if(action.startsWith('delete')){deleteItem(action.slice(6),id);return}if(action==='openEvents'||action==='openTasks'||action==='openContacts'){listView(action.slice(4));return}if(action==='filterEvents')window._eventFilter(filter);if(action==='modeEvents')window._eventMode(mode);if(action==='filterTasks')window._taskFilter(filter);if(action==='selectDay')window._eventSelect(el.dataset.date);if(action==='prevPeriod')window._eventPeriod(-1);if(action==='nextPeriod')window._eventPeriod(1);if(action==='addList'){const name=prompt('Nome della nuova lista');if(name&&name.trim()&&!state.lists.includes(name.trim())){state.lists.push(name.trim());save();listView('Tasks')}}if(action==='moveContact'){const fav=state.contacts.filter(c=>c.favorite).sort((a,b)=>(a.order??999)-(b.order??999));const i=fav.findIndex(c=>c.id===id),j=i+Number(dir);if(j>=0&&j<fav.length){[fav[i],fav[j]]=[fav[j],fav[i]];fav.forEach((c,k)=>c.order=k);save();render();listView('Contacts')}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.open-title')){e.preventDefault();e.target.click()}});$('#addEvent').onclick=()=>eventForm();$('#addTask').onclick=()=>taskForm();$('#addContact').onclick=()=>contactForm();$('#openEvents').onclick=$('#allEvents').onclick=()=>listView('Events');$('#openTasks').onclick=()=>listView('Tasks');$('#openContacts').onclick=()=>listView('Contacts');$('#search').onclick=()=>{const q=prompt('Cerca appuntamenti, attività o contatti');if(q===null||!q.trim())return;const s=q.toLocaleLowerCase('it');const items=[...state.events.filter(x=>x.title.toLocaleLowerCase('it').includes(s)).map(x=>['Evento',x.title,'editEvent',x.id]),...state.tasks.filter(x=>x.title.toLocaleLowerCase('it').includes(s)).map(x=>['Attività',x.title,'editTask',x.id]),...state.contacts.filter(x=>x.name.toLocaleLowerCase('it').includes(s)).map(x=>['Contatto',x.name,'editContact',x.id])];show('Risultati ricerca',items.map(x=>`<div class="listrow"><span><small>${x[0]}</small><br>${esc(x[1])}</span><button data-action="${x[2]}" data-id="${esc(x[3])}">Apri</button></div>`).join('')||'<p>Nessun risultato</p>')};$('#settings').onclick=()=>show('Impostazioni e dati',`<p>Questo prototipo salva i dati soltanto su questo dispositivo. Non include ancora account, condivisione familiare, sincronizzazione cloud o notifiche push.</p>${select('Promemoria predefinito','reminder',[['none','Nessuno'],['10','10 minuti'],['30','30 minuti'],['60','1 ora'],['1440','1 giorno']],state.defaultReminder||'30')}<div class="actions"><button class="primary" id="saveSettings">Salva preferenza</button><button class="primary" id="exportData">Esporta JSON</button></div><label class="field">Importa un backup JSON</label><input id="importData" type="file" accept="application/json,.json"><p class="muted">Importando un backup sostituirai i dati presenti, dopo conferma.</p>`);$('#modalBody').addEventListener('click',e=>{if(e.target.id==='saveSettings'){state.defaultReminder=$('#f_reminder').value;if(save())hide()}if(e.target.id==='exportData'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='OGGI-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});$('#modalBody').addEventListener('change',async e=>{if(e.target.id!=='importData'||!e.target.files?.[0])return;try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!['events','tasks','contacts','lists'].every(k=>Array.isArray(obj[k])))throw Error('Formato non valido');if(confirm('Sostituire tutti i dati locali con il backup selezionato?')){state=obj;if(save()){hide();render()}}}catch{alert('Impossibile importare il backup: file non valido.')}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
